name: quietnote
description: An offline-first AI notes and todos app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3
  flutter_gemma: ^0.8.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  lucide_icons: ^0.257.0
  go_router: ^17.5.0
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  home_widget: ^0.9.3
  permission_handler: ^13.0.1
  uuid: ^4.6.0
  file_picker: ^8.1.2
  intl: ^0.19.0
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2
  flutter_mermaid: ^0.1.0
  flutter_math_fork: ^0.7.3
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  image_picker: ^1.2.3
  fl_chart: ^1.2.0
  audioplayers: ^6.8.1
  pdf: ^3.11.1
  http: ^1.2.2
  syncfusion_flutter_pdf: ^27.2.5

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.23



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/branding/quietnote-logo.png
    - assets/branding/quietnote-logo.svg

flutter_gemma:
  model_assets:
    - assets/models/functiongemma-270m-it.task
    - assets/models/gemma-3n-E2B-it-int4.task

# Run `flutter pub get`, then add the model files to assets/models/ before building.
# The native model runners require Android NNAPI/CPU support and iOS Metal.
